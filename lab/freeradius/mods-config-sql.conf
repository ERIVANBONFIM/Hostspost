# Módulo sql do FreeRADIUS — LAB (montado como /etc/raddb/mods-available/sql)
# Aponta para o container MariaDB do compose. Baseado no mods-available/sql padrão.

sql {
    dialect = "mysql"
    driver  = "rlm_sql_${dialect}"

    # Conexão com o serviço "mariadb" do docker-compose
    server   = "mariadb"
    port     = 3306
    login    = "radius"
    password = "radpass"
    radius_db = "radius"

    # Lê grupos/perfis (radusergroup + radgroupcheck/reply) — necessário p/ perfis
    read_groups = yes

    # Tabelas de accounting e post-auth
    acct_table1    = "radacct"
    acct_table2    = "radacct"
    postauth_table = "radpostauth"

    # Tabelas de autorização
    authcheck_table  = "radcheck"
    authreply_table  = "radreply"
    groupcheck_table = "radgroupcheck"
    groupreply_table = "radgroupreply"
    usergroup_table  = "radusergroup"

    # remove sessões "presas" ao reautenticar (útil no teste de Simultaneous-Use)
    delete_stale_sessions = yes

    pool {
        start = 2
        min   = 1
        max   = 8
        spare = 2
        uses  = 0
        lifetime = 0
        idle_timeout = 60
    }

    # Mapeia grupos e inclui as queries padrão do dialeto (inclui simul_count_query,
    # accounting, post-auth etc. — NÃO reescrever à mão)
    group_attribute = "SQL-Group"
    $INCLUDE ${modconfdir}/${.:instance}/main/${dialect}/queries.conf
}
