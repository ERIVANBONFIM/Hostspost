# clients.conf — LAB de homologação (não usar em produção)
#
# NAS confiáveis que podem falar com este FreeRADIUS.
# Segredo do lab: "testing123". Em produção use segredo forte e único.

# radclient roda DENTRO do container (origem 127.0.0.1) durante os testes do Nível 1
client localhost {
    ipaddr    = 127.0.0.1
    secret    = testing123
    nas_type  = mikrotik
    shortname = lab-localhost
}

# Rede interna do Docker (caso o radclient rode de outro container)
client docker-net {
    ipaddr    = 172.16.0.0/12
    secret    = testing123
    nas_type  = mikrotik
    shortname = lab-docker
}

# NÍVEL 2 — MikroTik CHR do lab. Ajuste o IP para o do seu CHR e mantenha
# o mesmo secret no RouterOS (/radius add ... secret=testing123).
client mikrotik-chr {
    ipaddr    = 192.168.88.0/24
    secret    = testing123
    nas_type  = mikrotik
    shortname = lab-chr
}
